services:
  prosit-builder:
    build: .
    restart: unless-stopped
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD est obligatoire}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET est obligatoire}
      DATA_DIR: /data
      # Mettre à "false" uniquement pour tester en HTTP sans TLS (ex. http://localhost)
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - prosit-data:/data
    expose:
      - "3000"
    ports:
      - "${HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  prosit-data:
